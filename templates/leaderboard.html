<!DOCTYPE html>
<html>
<head>
    <title>LEADERBOARD</title>
    <link rel='stylesheet' href="{{url_for('static',filename='style.css')}}">
</head>
<body>
    <h1>LEADERBOARD</h1>
    <table border="1" align="center">
        <tr>
            <th>Name</th>
            <th>Score</th>
        </tr>
        {% for row in data %}
        <tr>
            <td>{{row[0]}}</td>
            <td>{{row[1]}}</td>
        </tr>
        {% endfor %}
    </table>
    <br>
    <a href="{{url_for('home')}}">
        <button>Back to Home</button>
    </a>
</body>
</html>
